<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grim Skill Display</title>
  <link rel="icon" href="data:," />
  <!-- OverlayPlugin bridge (addOverlayListener / startOverlayEvents) -->
  <script src="https://ngld.github.io/OverlayPlugin/assets/shared/common.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body>
  <noscript>You need to enable JavaScript to run Grim Skill Display.</noscript>

  <div class="app" id="app">
    <!-- ===== Header ===== -->
    <header class="header pinned" id="header">
      <div class="header-left">
        <img class="job-icon hide" id="job-icon" alt="" />
        <div class="header-text">
          <div class="title-row">
            <span id="title">Grim Skill Display</span>
            <span class="duration" id="duration">00:00</span>
          </div>
          <div class="info-row" id="info-row">
            <span id="desc">mirror your moves. sharpen your rotation.</span>
            <span class="stat hide" id="stat-uptime"></span>
            <span class="stat hide" id="stat-mispositional"></span>
            <span class="stat hide" id="stat-clip"></span>
            <span class="stat hide" id="stat-pet"></span>
          </div>
        </div>
      </div>

      <!-- Overlay FPS (top-center) -->
      <div class="fps" id="fps" data-tip="Overlay render rate (how smoothly this overlay is drawing — not the game's FPS)"></div>

      <!-- Live mini-meter (top-right) -->
      <div class="meter" id="meter">
        <div class="meter-value" id="meter-value">--</div>
        <div class="meter-label" id="meter-label" title="click to change metric">DPS</div>
      </div>

      <div class="header-menu">
        <i class="material-icons iconbutton" id="btn-center" data-tip="Center the bar inside the overlay window (stretch the window across your screen to center it on screen). Click again for full width">align_horizontal_center</i>
        <i class="material-icons iconbutton" id="btn-lock" data-tip="Lock Grim's layout controls (bar width / position / resize corner). To lock the window itself: right-click it in OverlayPlugin → Lock">lock_open</i>
        <i class="material-icons iconbutton" id="btn-pin" data-tip="Pin: keep this header always visible (otherwise it fades unless you hover the top)">push_pin</i>
        <i class="material-icons iconbutton" id="btn-review" data-tip="Pause &amp; review: freeze and scroll back through the whole pull">history</i>
        <i class="material-icons iconbutton" id="btn-reset" data-tip="Reset / end the current encounter in ACT and clear the bar">timer_off</i>
        <i class="material-icons iconbutton" id="btn-snapshot" data-tip="Save a PNG of your last ~15 seconds of skills">photo_camera</i>
        <i class="material-icons iconbutton" id="btn-settings" data-tip="Open settings">settings</i>
      </div>
    </header>

    <!-- ===== Main bar ===== -->
    <div class="main" id="main">
      <div class="dot-tracker hide" id="dot-tracker"></div>
      <div class="skilldisplayer bg-active" id="skilldisplayer">
        <div class="beat-grid hide" id="beat-grid"></div>
        <div class="markers" id="markers"></div>
        <div class="lane auto-attack-lane" id="auto-attack-lane"></div>
        <div class="lane player-lane" id="player-lane"></div>
        <div class="lane pet-lane" id="pet-lane"></div>
        <div class="buff-glow" id="buff-glow"></div>
      </div>
      <div class="countdown hide" id="countdown"></div>
      <div class="dot-alert-flash" id="dot-alert-flash"></div>
    </div>

    <!-- ===== Overlays ===== -->
    <div class="review hide" id="review"></div>
    <div class="summary hide" id="summary"></div>
  </div>

  <!-- settings modal: covers the whole overlay window, not just the bar -->
  <aside class="settings hide" id="settings"></aside>
  <span class="resize-handler"></span>

  <!-- Self-updating bootstrap. OverlayPlugin's embedded browser caches hard and its Reload
       doesn't revalidate, so: read version.json (never cached), and if it changed since the
       last run re-download every listed file past the cache, then start the app. -->
  <script>
    (async () => {
      const KEY = 'grim-version';
      try {
        const m = await (await fetch('./version.json', { cache: 'no-store' })).json();
        let have = null;
        try { have = localStorage.getItem(KEY); } catch {}
        if (have !== m.version) {
          await Promise.all((m.files || []).map((f) => fetch(f, { cache: 'reload' }).catch(() => {})));
          try { localStorage.setItem(KEY, m.version); } catch {}
          if (have !== null) { location.reload(); return; } // index.html itself was refreshed too
        }
      } catch {}
      import('./src/app.js');
    })();
  </script>
</body>
</html>
